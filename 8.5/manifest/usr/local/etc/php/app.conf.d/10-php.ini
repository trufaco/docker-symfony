[PHP]
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = -1
max_execution_time = 60
max_input_time = 30
expose_php = Off
date.timezone = UTC
session.use_strict_mode = 1
session.auto_start = Off
short_open_tag = Off
zend.detect_unicode = Off
; CVE-2026-109619: keep off after patching too (advisory GHSA-6wmf-4rv5-p3rp); unused, rarely tested
session.upload_progress.enabled = 0
